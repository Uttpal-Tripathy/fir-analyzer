<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FIR Analyzer – Offline</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
      .card { max-width: 440px; text-align: center; padding: 32px; }
      h1 { font-size: 20px; letter-spacing: .08em; }
      p { color: #94a3b8; line-height: 1.5; }
      code { color: #cbd5e1; word-break: break-all; }
      button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>CAN'T REACH FIR ANALYZER</h1>
      <p>Check your internet connection. The free server may also be waking up, which can take up to a minute.</p>
      <p><code id="detail"></code></p>
      <button id="retry">Retry</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const url = params.get("url");
      document.getElementById("detail").textContent = `${url} (${params.get("error") || "unavailable"})`;
      document.getElementById("retry").onclick = () => { location.href = url; };
    </script>
  </body>
</html>
